# Copyright (c) 2026, Michael Grier

[package]
name = "harrier"
version = "0.1.2"
edition = "2024"
description = "A line-map and character-encoding-aware red-green tree for structured, lossless, incrementally-editable text"
license = "MIT"
repository = "https://github.com/MikeGrier/harrier-rs"
readme = "README.md"
keywords = ["text", "lsp", "encoding", "line-map", "red-green-tree"]
categories = ["text-processing", "parsing"]

[dependencies]
chardetng = "0.1"
encoding_rs = "0.8"
mallard = "0.1"
redwing = "0.3"
regex-syntax = "0.8"

[dev-dependencies]
memmap2 = "0.9"
regex = "1"
tempfile = "3"
